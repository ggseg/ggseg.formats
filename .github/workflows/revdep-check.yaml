# Reverse-dependency check: run the core consumers' R CMD check against the
# version of ggseg.formats in this branch. Deliberate (workflow_dispatch) —
# run it before minting a release version, since ggseg.formats is the
# foundation that ggseg / ggseg3d / ggseg.extra render through.
on:
  workflow_dispatch:

name: revdep-check.yaml

permissions: read-all

jobs:
  revdep:
    uses: ggsegverse/.github/.github/workflows/revdep-check.yaml@main
    with:
      revdeps: '["ggsegverse/ggseg", "ggsegverse/ggseg3d", "ggsegverse/ggseg.extra"]'
      install-spatial-deps: true
